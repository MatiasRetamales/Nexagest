{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="{% static 'administracion/css/reset_password_cocinero.css' %}">
</head>

<body>

<div class="container">

    <h1>Restablecer contraseña</h1>

    <p>
        Usuario: <strong>{{ cocinero.user.username }}</strong>
    </p>

    <form method="post">
        {% csrf_token %}

        <label for="password">Nueva contraseña</label>
        <input type="password" name="password" id="password" required>

        <label for="password2">Confirmar contraseña</label>
        <input type="password" name="password2" id="password2" required>

        <button type="submit">
            Guardar nueva contraseña
        </button>
    </form>

    <a href="{% url 'gestionar_cocineros' %}">
        ⬅ Volver
    </a>

</div>

</body>
</html>
