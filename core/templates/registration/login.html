{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NexaGest - Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<div class="login-card">
    <img src="{% static 'core/img/logo_nexagest.png' %}" alt="Logo Nexagest" class="logo-login">
    <p>Ingresa tus credenciales de trabajo</p>

    {% if form.errors %}
        <p class="error-msg">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div>
            <label for="id_username">Usuario:</label>
            {{ form.username }}
        </div>
        <div>
            <label for="id_password">Contraseña:</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn-enviar">Entrar al Sistema</button>
    </form>
</div>

</body>
</html>
